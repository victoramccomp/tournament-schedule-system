name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes, build e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios, só para o build compilar. Os reais ficam na Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json ainda não existe: usando npm install (rode o workflow 'Gerar package-lock')."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (inclui checagem de tipos do Next)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
