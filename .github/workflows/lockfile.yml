name: Gerar package-lock

# Execução manual (Actions > Gerar package-lock > Run workflow).
# Gera/atualiza o package-lock.json no GitHub, já que nada é instalado localmente.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gerar lockfile (sem instalar nada)
        run: npm install --package-lock-only

      - name: Commit do lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Sem alterações no lockfile."
          else
            git commit -m "chore: atualiza package-lock.json"
            git push
          fi
